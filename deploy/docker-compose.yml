# 本地向量库与图数据库（与 hello_agents 默认 .env 对齐）
# 启动：在仓库根目录执行  docker compose -f deploy/docker-compose.yml up -d
# 停止：docker compose -f deploy/docker-compose.yml down
# 数据持久化在 Docker 命名卷 deploy_qdrant_data / deploy_neo4j_data
#
# 若拉取镜像超时（直连 registry-1.docker.io 失败），在 Linux 上配置镜像加速，例如：
#   sudo tee /etc/docker/daemon.json <<'EOF'
#   {"registry-mirrors":["https://docker.1ms.run","https://docker.m.daocloud.io"]}
#   EOF
#   sudo service docker restart
# 亦可在阿里云控制台申请专属镜像地址：https://cr.console.aliyun.com/cn-hangzhou/instances/mirrors

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/hello-agents-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
